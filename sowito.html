<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOWITO'S DANCE</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="img/icon2.png" />
</head>

<body class="load-body">

    <div class="story-container load-container">

        <h1>SOWITO'S DANCE</h1>

        <div class="load-content">

            <div id="image-flip-box" class="image-flip-box">
                <img id="load-image" src="img/foxdance.webp" alt="Recuerdo de la Partida" class="load-image" />
            </div>

            <p class="image-caption">Lluvia </p>

            <div class="control-buttons">
                <button id="flip-button" class="nav-button flip-button">
                    BAILA SOWITO
                </button>

                <button id="change-music-button" class="nav-button change-music-button">
                    MUSICA
                </button>
            </div>

            <audio id="secret-audio" preload="auto" loop></audio>

        </div>

        <a href="index.html" class="nav-button back-to-menu">
            VOLVER AL INICIO
        </a>

    </div>

    <script>
        const flipButton = document.getElementById('flip-button');
        const changeMusicButton = document.getElementById('change-music-button');
        const imageFlipBox = document.getElementById('image-flip-box');
        const secretAudio = document.getElementById('secret-audio');

        let isFlipped = false;
        let isPlaying = false;
        let currentSongIndex = -1; 

        // SONGS SOWEZCAS

        const musicTracks = [
            'musica/ahora.mp3',
        ];

        //REPRODUCCION DE CANCIONES ALEATORIAMENTE 
        function playRandomMusic() {
           
            if (isPlaying) {
                secretAudio.pause();
            }

            let newIndex;
           
            do {
                newIndex = Math.floor(Math.random() * musicTracks.length);
            } while (newIndex === currentSongIndex && musicTracks.length > 1); 

          
            secretAudio.src = musicTracks[newIndex];
            currentSongIndex = newIndex;

            const playPromise = secretAudio.play();

            if (playPromise !== undefined) {
                playPromise.then(() => {
                    isPlaying = true;
                    console.log(`Reproduciendo: ${musicTracks[newIndex]}`);
                }).catch(error => {
                    console.error('Hubo un error :(', error);
                  
                });
            }
        }

        // bOTON PARA INVERTIR FOTO -W-
        flipButton.addEventListener('click', () => {
          
            if (!isPlaying) {
                playRandomMusic();
            }

            // Manejar el Volteo (Flip)
            if (isFlipped) {
                imageFlipBox.classList.remove('flipped');
                isFlipped = false;
                flipButton.textContent = 'BAILA SOWITO';
            } else {
                imageFlipBox.classList.add('flipped');
                isFlipped = true;
                flipButton.textContent = 'BAILA SOWITO';
            }
        });

        //BOTON CAMBIAR MUSICA
        changeMusicButton.addEventListener('click', () => {
            playRandomMusic();
        });

       
        window.addEventListener('beforeunload', () => {
            if (isPlaying) {
                secretAudio.pause();
                secretAudio.currentTime = 0;
            }
        });
    </script>
</body>

</html>
